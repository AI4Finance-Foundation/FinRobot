repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: local
    hooks:
      # 校验本地 AI harness（CLAUDE.md / AGENTS.md / .claude/agents / .codex/agents，
      # 这些是 gitignore 的本地文件，所以 always_run 从磁盘读，而非看 staged 文件）。
      - id: harness-drift
        name: harness drift (agent/CLAUDE 路径 ≡ 真实代码)
        entry: python3 scripts/check-harness-drift.py
        language: system
        always_run: true
        pass_filenames: false
