[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finagent"
version = "0.1.0"
description = "A financial AI agent platform with extensible skill ecosystem"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "FinAgent Contributors" },
]
keywords = ["finance", "ai", "agent", "llm", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic-ai>=1.70.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "aiosqlite>=0.20",
    "yfinance>=0.2",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[project.scripts]
finagent = "finagent.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that call real external APIs (yfinance, LLM)",
    "slow: tests that take > 10 seconds",
]

[tool.ruff]
target-version = "py311"
line-length = 100